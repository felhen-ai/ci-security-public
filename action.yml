name: Felhen secret scan
description: Scans the supplied Git revision range with Felhen's pinned Gitleaks policy.

inputs:
  base-ref:
    description: Base commit SHA for the range to scan.
    required: true
  head-ref:
    description: Head commit SHA for the range to scan.
    required: true

runs:
  using: composite
  steps:
    - name: Instalar Gitleaks fixado
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
        expected_sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        curl --fail --location --silent --show-error --output "$archive" \
          'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
        actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
        test "$actual_sha" = "$expected_sha"
        install_dir="$RUNNER_TEMP/felhen-gitleaks"
        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
        chmod 0755 "$install_dir/gitleaks"
        printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
    - name: Escanear intervalo Git
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_REF: ${{ inputs.head-ref }}
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/felhen-gitleaks-report.json"
        rm -f "$report"
        set +e
        env -u GITLEAKS_CONFIG gitleaks git -c "$GITHUB_ACTION_PATH/gitleaks.toml" --log-opts="$BASE_REF..$HEAD_REF" --redact=100 --ignore-gitleaks-allow --report-format json --report-path "$report" >/dev/null 2>&1
        scan_status=$?
        set -e
        python3 - "$report" "$GITHUB_STEP_SUMMARY" <<'PY'
        import json
        import pathlib
        import sys

        report_path = pathlib.Path(sys.argv[1])
        summary_path = pathlib.Path(sys.argv[2])
        findings = []
        if report_path.is_file():
            findings = json.loads(report_path.read_text(encoding="utf-8"))
        lines = ["## Secret scan", "", "Para falso positivo revisado, adicione somente o fingerprint a `.gitleaksignore` na PR."]
        if findings:
            lines.extend(["", "| Regra | Arquivo | Linha | Commit | Fingerprint |", "| --- | --- | ---: | --- | --- |"])
            for finding in findings:
                lines.append("| {rule} | {file} | {line} | {commit} | {fingerprint} |".format(
                    rule=finding.get("RuleID", ""),
                    file=finding.get("File", ""),
                    line=finding.get("StartLine", ""),
                    commit=finding.get("Commit", "")[:12],
                    fingerprint=finding.get("Fingerprint", ""),
                ))
        else:
            lines.extend(["", "Nenhum achado."])
        summary_path.open("a", encoding="utf-8").write("\n".join(lines) + "\n")
        PY
        if [ "$scan_status" -ne 0 ]; then
          echo 'Secret scan falhou; consulte o summary seguro do job.' >&2
          exit "$scan_status"
        fi
