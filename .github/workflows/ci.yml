name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          expected_sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error --output "$archive" 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          mkdir -p "$RUNNER_TEMP/felhen-gitleaks"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/felhen-gitleaks" gitleaks
          chmod 0755 "$RUNNER_TEMP/felhen-gitleaks/gitleaks"
          printf '%s\n' "$RUNNER_TEMP/felhen-gitleaks" >> "$GITHUB_PATH"
      - name: Test fixtures
        run: python3 -I tests/run_fixtures.py
